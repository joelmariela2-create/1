openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public catalog and owner product management
  - name: orders
    description: Store orders and owner order management
  - name: admin
    description: Owner-only administration
  - name: storage
    description: Owner-only product image uploads
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders for the owner
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a storefront order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Get owner dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a product image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Owner access required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, price, description, category, imageUrl, imageUrls, sizes, stock, featured, active, createdAt, updatedAt]
      properties:
        id: { type: number }
        name: { type: string }
        price: { type: number }
        description: { type: ["string", "null"] }
        category: { type: string }
        imageUrl: { type: ["string", "null"] }
        imageUrls:
          type: array
          items: { type: string }
        sizes:
          type: array
          items: { type: string }
        stock: { type: number }
        featured: { type: boolean }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, price, category, sizes, stock]
      properties:
        name: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        description: { type: ["string", "null"] }
        category: { type: string, minLength: 1 }
        imageUrl: { type: ["string", "null"] }
        imageUrls:
          type: array
          items: { type: string }
        sizes:
          type: array
          items: { type: string }
        stock: { type: number, minimum: 0 }
        featured: { type: boolean }
        active: { type: boolean }
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        description: { type: ["string", "null"] }
        category: { type: string, minLength: 1 }
        imageUrl: { type: ["string", "null"] }
        imageUrls:
          type: array
          items: { type: string }
        sizes:
          type: array
          items: { type: string }
        stock: { type: number, minimum: 0 }
        featured: { type: boolean }
        active: { type: boolean }
    OrderItem:
      type: object
      required: [productId, productName, quantity, unitPrice]
      properties:
        productId: { type: number }
        productName: { type: string }
        size: { type: ["string", "null"] }
        quantity: { type: number, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        imageUrl: { type: ["string", "null"] }
    Order:
      type: object
      required: [id, customerName, phone, country, city, items, total, status, createdAt, updatedAt]
      properties:
        id: { type: number }
        customerName: { type: string }
        phone: { type: string }
        country: { type: string }
        city: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total: { type: number }
        status:
          type: string
          enum: [pending, confirmed, preparing, shipped, delivered, cancelled]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderInput:
      type: object
      required: [customerName, phone, country, city, items, total]
      properties:
        customerName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        country: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        total: { type: number, minimum: 0 }
    OrderUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, preparing, shipped, delivered, cancelled]
    AdminSummary:
      type: object
      required: [productCount, lowStockCount, orderCount, pendingOrderCount, revenue]
      properties:
        productCount: { type: number }
        lowStockCount: { type: number }
        orderCount: { type: number }
        pendingOrderCount: { type: number }
        revenue: { type: number }
    UploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: number, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }

